name: Research checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py train.py paper.py robinhood_quotes.py scout
      - run: python app.py --report /tmp/research.json
      - run: python train.py --episodes 4 --output /tmp/training-check
      - run: python paper.py --policy /tmp/training-check/policy.json --steps 5 --output /tmp/policy-paper.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check web/dashboard.js
      - run: node tests/test_dashboard.cjs
